# rlx Android app (PLAN §6f, docs/PLAY.md): a debug APK on every push to main
# that touches the app or its shipped files, and on demand; a signed release
# bundle (.aab) too when the four signing secrets exist. On a manual run only,
# a smoke job installs the debug APK on an emulator and walks hub, game and back,
# on API 35 (Android 15, the back key) and API 36 (Android 16, the back gesture).
# Every third-party action is pinned by its full commit SHA (row X36; the tag it
# was resolved from is in the comment). To update one, resolve the new tag's
# commit (git ls-remote https://github.com/<owner>/<repo> 'refs/tags/<tag>*';
# for an annotated tag the ^{} line) and replace SHA and comment together.
name: android

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'shared/**'
      - 'hub/**'
      - 'games/**'
      - 'icons/**'
      - 'tools/build-www.mjs'
      - 'tools/android-smoke.sh'
      - 'tools/android-smoke-check.py'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RLX_VERSION_CODE: ${{ github.run_number }}  # app/build.gradle adds 101
      HAS_UPLOAD_KEY: ${{ secrets.RLX_KEYSTORE_B64 != '' && secrets.RLX_KEYSTORE_PASSWORD != '' && secrets.RLX_KEY_ALIAS != '' && secrets.RLX_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The Gradle wrapper jar in git must be one Gradle published (row X36), before anything runs it.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - name: Web tests (Node)
        run: |
          for t in bricks-sim catch-sim putt-sim stack-sim haptics-native; do node tests/$t.mjs > /tmp/$t.log || { tail -40 /tmp/$t.log; exit 1; }; tail -1 /tmp/$t.log; done

      - name: Copy the shipped web files (sw.js FILES) into the app
        run: node tools/build-www.mjs

      - name: Capacitor sync
        working-directory: android-app
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Android SDK (the runner's own; platform 36 and build tools)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Build the debug APK
        working-directory: android-app/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Check the built app (package, SDK levels, permissions, files)
        run: |
          APK=android-app/android/app/build/outputs/apk/debug/app-debug.apk
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          "$AAPT2" dump badging "$APK" > /tmp/badging.txt
          "$AAPT2" dump permissions "$APK" > /tmp/perms.txt
          cat /tmp/perms.txt
          grep -E "^package: name='io.github.apcanario.rlx'" /tmp/badging.txt
          grep -E "^(minSdkVersion|sdkVersion|targetSdkVersion)|^application-label|launchable-activity" /tmp/badging.txt || true
          grep -q "targetSdkVersion:'36'" /tmp/badging.txt
          grep -Eq "^(minSdkVersion|sdkVersion):'24'" /tmp/badging.txt
          grep -q "application-label:'rlx'" /tmp/badging.txt
          # Only VIBRATE (Android adds a signature-level DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION of the app's own; it is not a user permission).
          others=$(grep "^uses-permission:" /tmp/perms.txt | grep -v "name='android.permission.VIBRATE'" | grep -v "name='io.github.apcanario.rlx.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'" || true)
          if [ -n "$others" ]; then echo "unexpected permissions: $others"; exit 1; fi
          grep -q "name='android.permission.VIBRATE'" /tmp/perms.txt
          # The web files in the APK are exactly sw.js FILES, and sw.js is not among them.
          # (cap sync adds two empty Cordova stubs of its own, cordova.js and cordova_plugins.js; no page loads them.)
          unzip -Z1 "$APK" | grep '^assets/public/' | grep -v '/$' | sed 's|^assets/public/||' | grep -vx 'cordova.js\|cordova_plugins.js' | sort > /tmp/apk-files.txt
          node -e "import('./tools/build-www.mjs').then(m => console.log(m.shippedFiles().sort().join('\n')))" | sort > /tmp/sw-files.txt
          diff /tmp/sw-files.txt /tmp/apk-files.txt
          echo "APK checks passed: $(wc -l < /tmp/apk-files.txt) web files, VIBRATE only, targetSdk 36" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rlx-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build the signed release bundle
        if: env.HAS_UPLOAD_KEY == 'true'
        working-directory: android-app/android
        env:
          RLX_KEYSTORE_B64: ${{ secrets.RLX_KEYSTORE_B64 }}
          RLX_KEYSTORE_PASSWORD: ${{ secrets.RLX_KEYSTORE_PASSWORD }}
          RLX_KEY_ALIAS: ${{ secrets.RLX_KEY_ALIAS }}
          RLX_KEY_PASSWORD: ${{ secrets.RLX_KEY_PASSWORD }}
        run: |
          export RLX_KEYSTORE_PATH="$RUNNER_TEMP/rlx-upload.jks"
          printf '%s' "$RLX_KEYSTORE_B64" | base64 -d > "$RLX_KEYSTORE_PATH"
          trap 'rm -f "$RLX_KEYSTORE_PATH"' EXIT
          ./gradlew --no-daemon bundleRelease
          # Strict, against the upload key itself (a self-signed key fails -strict without it); an unsigned
          # bundle still exits 0 ("jar is unsigned"), so "jar verified" must be in the output too.
          jarsigner -verify -strict -keystore "$RLX_KEYSTORE_PATH" -storepass:env RLX_KEYSTORE_PASSWORD \
            app/build/outputs/bundle/release/app-release.aab "$RLX_KEY_ALIAS" > /tmp/jarsigner.txt 2>&1 || { cat /tmp/jarsigner.txt; exit 1; }
          grep -q "jar verified" /tmp/jarsigner.txt || { cat /tmp/jarsigner.txt; echo "app-release.aab is not signed by the upload key"; exit 1; }
          echo "Signed release bundle built (versionCode $((RLX_VERSION_CODE + 101)))." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          name: rlx-release-aab
          path: android-app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: No upload key
        if: env.HAS_UPLOAD_KEY != 'true'
        run: |
          echo "No release bundle: the four RLX_* signing secrets are not all set (docs/PLAY.md). Debug APK only." >> "$GITHUB_STEP_SUMMARY"

  # Optional, manual runs only (Actions, android, Run workflow): not part of a push build.
  # API 35 presses the back key; API 36 (Android 16) switches the emulator to gesture navigation and
  # swipes in from the left edge, the predictive back path (on by default for an app targeting 36).
  smoke:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 35
            back: key
          - api-level: 36
            back: gesture
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rlx-debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - run: python3 -m pip install --quiet pillow

      - name: Install, open the hub, a game, back, back (API ${{ matrix.api-level }}, back by ${{ matrix.back }})
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tools/android-smoke.sh apk/app-debug.apk smoke-out ${{ matrix.back }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: rlx-smoke-api${{ matrix.api-level }}
          path: smoke-out
