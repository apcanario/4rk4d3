# Decisions in review. verdict: "held" or "needs work". key = true: one of the three shown in the brief.
# section: the heading of case.md where its insight shows. tradeoff: what was given up.

[[decisions]]
title = "Android only"
key = true
tradeoff = "No iPhone users, ever, without a rewrite of input and haptics."
verdict = "held"
section = "Strategy"
what = "One platform, mine. No iOS or Safari work."
evidence = "It removed the only obstacle to haptics, and the Android app shipped with a native vibration plugin the morning after (docs/CHANGELOG.md, P3)."
insight = "A product for one user can pick one platform. Every workaround not written is time spent on feel."

[[decisions]]
title = "Nothing on screen but the game"
key = true
tradeoff = "No way to show progress, teach a gesture or offer a choice. The game has to explain itself."
verdict = "held"
section = "Strategy"
what = "No points, buttons, saved state, settings or text."
evidence = "The rule survived the rewrite: v2's spec lists it under \"Rules that hold\", unchanged (docs/V2.md §3)."
insight = "A rule stated as an absence is easy to check and hard to erode. Each addition has to argue against it."

[[decisions]]
title = "Check the design against research, and say where it stops"
key = false
tradeoff = "An hour of the first evening, and a claim I chose not to make."
verdict = "held"
section = "Evidence"
what = "Asked for the evidence on winding down and judged our own rules against it."
evidence = "The constant-speed rule was withdrawn within the hour for a hidden adaptive pace; the plan states that no study tested games like these and makes no health claim."
insight = "Asking the AI to audit its own plan found a flaw that taste would not have."

[[decisions]]
title = "One shared value for thumb travel"
key = false
tradeoff = "Games cannot have their own feel for the drag without breaking the rule."
verdict = "held"
section = "Leadership"
what = "Sensitivity comes from one named fraction of the screen width, shared by every drag game."
evidence = "Four feel reports moved it 65, 50, 35, 28 percent. Each was a one-value change (docs/CHANGELOG.md, B3 and B3a)."
insight = "If feel can only be judged by hand, make each judgement cost one number."

[[decisions]]
title = "A bundled app, not a website wrapper"
key = false
tradeoff = "A native shell to maintain, and a release that no longer updates by itself like the web app."
verdict = "held"
section = "Leadership"
what = "The game files ship inside the Android app, with a native haptics plugin."
evidence = "It runs offline and vibrates without Chrome's tap rule. First install: \"Works so good!!! It's perfect.\""
insight = "Reading the store's rules before building chose the architecture."

[[decisions]]
title = "The design chat never touches the repo"
key = false
tradeoff = "Every plan change needs me to carry a file by hand."
verdict = "held"
section = "Orchestration"
what = "Plans leave the design chat as a bundle that I upload between builds."
evidence = "No push collided with a running build on this project. On Groovebox one had."
insight = "A fault in one project became a rule in the next."

[[decisions]]
title = "Five games before one was lived with"
key = true
tradeoff = "Speed of specification was bought with two days of build spent on games that were archived."
verdict = "needs work"
section = "Product"
what = "Catch, Putt, Stack and Glide were specified and built within two days of the idea."
evidence = "On day three all four were archived (docs/V2.md: \"I'm overthinking it\"). Their specs, tests and reviews bought nothing that shipped, apart from Putt's pull gesture, reused in Pool."
insight = "Design while it builds is fast, and it let breadth outrun use. Next time: one game on the phone for a day before the second is specified."

[[decisions]]
title = "An unattended loop with no stop rule"
key = false
tradeoff = "Autonomy was bought with money and my attention."
verdict = "needs work"
section = "Where it went wrong"
what = "The Android build ran on the build server from a cloud chat that could not build locally."
evidence = "Four failed builds in a row, then an emulator test nobody asked for, on my budget, until I stopped it (docs/CHANGELOG.md, case study notes, item 8)."
insight = "Any agent loop on a paid resource needs its scope and its stop condition written before it starts."

[[decisions]]
title = "Store work before the store account"
key = false
tradeoff = "Hours on assets that went stale in a day."
verdict = "needs work"
section = "Leadership"
what = "Listing, screenshots, rating answers and a signed-bundle pipeline were prepared for Google Play."
evidence = "There is no developer account yet, and since v2 the listing and screenshots name five games and are stale (docs/BACKLOG.md, Proposed)."
insight = "Prepare the release when the release is possible. The research was worth doing early; the assets were not."

[[decisions]]
title = "v2 dropped the reviewer"
key = false
tradeoff = "One session instead of several, paid for in confidence."
verdict = "needs work"
section = "Orchestration"
what = "The whole of v2 was one session with no builder and reviewer split."
evidence = "The changelog says so (\"no other agents, no separate reviewer\"), the first push went red on CI, and ten phone checks are still open."
insight = "The review that caught the store blockers in v1 was the first thing cut when the brief said do less. Cut scope, keep the check."

