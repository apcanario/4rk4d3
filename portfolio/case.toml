biggest_cut = "Scores, buttons, settings, saved games, then three of five games"
memory = "Spec, backlog, changelog"
review = "A fresh reviewer on every row of v1"
judge = "Simulation checks, a browser suite, measured contrast"
my_test = "By thumb"

summary = "I defined a game by what it refuses to have, built five in two days with AI agents, then cut to two when I saw I was overthinking it."

[outcome]
result = "A game I open instead of a feed. It installs, runs and plays well on my phone."
evidence = "My own install and feel reports (docs/CHANGELOG.md, 26 and 27 Nov 2026). One user: me."
not_measured = "Whether it replaces scrolling over weeks. Nothing counts sessions, by design: the app stores nothing."
next = "The ten open phone checks of v2, then a decision on the Play release."

[[orchestration]]
role = "Design"
model = "Fable"
why = "The spec, the research and the mockups need the most capable model, and it builds nothing in volume."

[[orchestration]]
role = "Run"
model = "Sonnet 5.5"
why = "Reads the backlog, launches agents, keeps the records. Cheap, and kept thin on purpose."

[[orchestration]]
role = "Build and review"
model = "Opus 5.5, a fresh agent each"
why = "The reviewer has not seen the build, so the author never checks its own work."

[[checks]]
name = "Simulations without a screen"
what = "Each game's physics runs in Node for simulated minutes of play: no stuck ball, nothing tunnels, nothing stored."

[[checks]]
name = "Measured contrast"
what = "Every piece must reach a set ratio on its ground in light and dark. A colour that fails is moved until it passes."

[[checks]]
name = "Pixel comparison"
what = "A paused frame is compared with the bare scene, so nothing can be drawn on top of the game."

