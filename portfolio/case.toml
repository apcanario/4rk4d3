[shows]
strategy = "Defined the product by what it refuses to have, and checked the design against research before building on it."
product = "Removed every feature the AI volunteered, then removed three of my own five games."
design = "Two pictures to the look. A hub with no words. Pastel with enforced contrast. Controls sized to a resting thumb."
ai = "Fixed a process fault from the last project. Stopped a runaway loop and set its limits."
planning = "Four games specified in one evening while builds ran. Store requirements researched before the app was wrapped."
delivery = "31 commits in the first 20 hours, ending with an installed Android app, a release pipeline and a store listing."

[method]
started_as = "A feeling I described"
