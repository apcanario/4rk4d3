ai = "Claude in three roles: one model to design and research with me, one to run each build chat, fresh agents to write and review the code."
stack = "Plain HTML, CSS and JavaScript on a pixel canvas. No build step, no dependencies. GitHub Pages, and a Capacitor shell for Android."
state = "v2 is live as a web app: Bricks and Pool. v1's five games are archived on a branch. Google Play release prepared, account on hold."

