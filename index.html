<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFF7EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141026" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>rlx</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="shared/theme.css">
</head>
<body>
<canvas class="screen" id="screen" role="img" aria-label="Two games: Bricks and Pool. The Android back gesture returns from a game."></canvas>
<script type="module">
import { INPUT, createScreen, drawScene, initPage, hitTest, publishHits, atSideEdge } from './shared/pixel.js';
import { sessionClock, phaseOf, sceneStep } from './shared/session.js';
import { CARDS, gridLayout, hubScene, windowOf, drawCard } from './hub/cards.js';
import { onThemeChange } from './shared/tokens.js';
import { LIFE, driftClouds, shimmer, drawSceneLife } from './hub/life.js';

initPage();

// The hub is the two game cards and nothing else (docs/V2.md §5): two framed
// windows onto the games side by side over the sunset scene. No text of any kind.

const clock = sessionClock(); // the one session clock: the hub holds it, the games it opens share it
let pressed = null;
let grid = null;

// The hub is alive: clouds drift, gulls and a boat cross the sky, the sea glitters, the cards ride the swell,
// each card's picture moves. tm is the hub's own clock in seconds; reduced motion keeps it at 0, the still picture.
const still = matchMedia('(prefers-reduced-motion: reduce)');
let tm = 0;

/** The side band where a touch is ignored (INPUT.edgeIgnoreCssPx), in logical px from the canvas's own edge. */
function edgeBand(s) {
  const ratio = canvas.width / Math.max(1, canvas.clientWidth); // device px per CSS px
  return Math.max(0, Math.ceil((INPUT.edgeIgnoreCssPx * ratio - s.ox) / s.scale));
}

function draw(ctx, s) {
  grid = gridLayout(s.W, s.H, s.safe, edgeBand(s));
  // The hub never advances the clock; it shows the phase it stands at.
  const phase = phaseOf(clock.active);
  // The sky above the low grid is the picture: the horizon sits just above the
  // cards, the sun on it, clouds and (at the last steps) stars above (§5a).
  const scene = hubScene(grid, s.safe);
  const m = still.matches ? 0 : tm;
  drawScene(ctx, s.W, s.H, { ...scene, phase, clouds: driftClouds(scene.clouds, s.W, m), glints: shimmer(scene.glints, m) });
  drawSceneLife(ctx, s.W, grid.horizon, s.safe.top, m);
  const step = sceneStep(phase);
  canvas.dataset.scene = String(step);
  canvas.dataset.tm = m.toFixed(2);
  const windows = {};
  for (const c of CARDS) {
    drawCard(ctx, c.id, grid.cards[c.id], step, pressed === c.id, m);
    windows[c.id] = windowOf(grid.cards[c.id]);
  }
  canvas.dataset.grid = JSON.stringify({ ...grid, windows, edge: edgeBand(s), safe: s.safe, stars: scene.stars, starCount: scene.starCount ?? null, clouds: scene.clouds, sunX: scene.sunX, sunRadius: scene.sunRadius, glints: scene.glints });
  publishHits(canvas, s, grid.cards);
}

const canvas = document.getElementById('screen');
const screen = createScreen(canvas, draw);
// Row D1: the phone switched between light and dark: the hub draws everything from the tokens each time, so it just redraws, on the next frame.
onThemeChange(() => requestAnimationFrame(() => screen.render()));

/* ---------- opening a game: a fresh frame over the hub ---------- */

// The game is made on the card's touch, so the tap that opens it also counts
// as the game page's own tap (Chrome lets a page vibrate only after one); it
// shows when the touch lifts on the card, with a history entry, so the
// Android back gesture returns here. Going back removes the frame: the next
// opening is a fresh game. The page itself never leaves the hub, so the
// session clock lives on in memory across games.
let game = null; // { el, id, shown }

function prepare(t) {
  discard();
  const el = document.createElement('iframe');
  el.className = 'game';
  el.title = t.name;
  el.src = t.href;
  document.body.appendChild(el);
  game = { el, id: t.id, shown: false };
}

function show() {
  game.shown = true;
  game.el.classList.add('shown');
  document.body.dataset.game = game.id;
  history.pushState({ rlx: game.id }, '');
}

function discard() {
  if (!game) return;
  game.el.remove();
  game = null;
  delete document.body.dataset.game;
}

addEventListener('popstate', () => {
  if (game && game.shown) {
    discard();
    screen.render();
  }
});
// Reopened on a game's history entry (a reload): the hub shows, with no game.
// The entry is left behind with one back, so the first back gesture after a reload does not land on the hub again.
if (history.state && history.state.rlx) history.back();

function targetAt(e) {
  const p = screen.toLogical(e.clientX, e.clientY);
  for (const c of CARDS) if (hitTest(p, grid.cards[c.id], 2)) return c.id;
  return null;
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (game && game.shown) return;
  if (atSideEdge(e)) return; // the back gesture's band: a touch that begins here opens nothing
  pressed = targetAt(e);
  if (pressed) {
    prepare(CARDS.find((c) => c.id === pressed));
    screen.render();
  }
});

canvas.addEventListener('pointerup', (e) => {
  e.preventDefault();
  const hit = targetAt(e);
  const was = pressed;
  pressed = null;
  if (hit && hit === was && game && !game.shown) show();
  else if (game && !game.shown) discard();
  screen.render();
});

const release = () => {
  if (pressed) {
    pressed = null;
    if (game && !game.shown) discard();
    screen.render();
  }
};
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('pointerleave', release);
addEventListener('pageshow', () => { release(); screen.render(); });
// The loop: it draws only while the hub is what is shown (not hidden, no game open) and motion is allowed.
const born = performance.now();
let lastFrame = 0;
function tick(now) {
  requestAnimationFrame(tick);
  if (still.matches || document.hidden || (game && game.shown) || now - lastFrame < 1000 / LIFE.fps) return;
  lastFrame = now;
  tm = (now - born) / 1000;
  screen.render();
}
requestAnimationFrame(tick);
still.addEventListener('change', () => { tm = 0; screen.render(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) screen.render(); });
</script>
</body>
</html>
