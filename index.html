<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFF7EC">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>RLX</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="shared/theme.css">
</head>
<body>
<canvas class="screen" id="screen" role="img" aria-label="RLX: Bricks, Catch, Putt and Stack. Haptics setting."></canvas>
<script type="module">
import { COLORS, mix, edge } from './shared/tokens.js';
import { drawFitted, fitSize, measure } from './shared/font.js';
import {
  createScreen, drawScene, pixelBody, initPage, hitTest, publishHits, openPage, SEA_HEIGHT, SUN_RADIUS,
} from './shared/pixel.js';
import { hapticsOn, setHaptics } from './shared/settings.js';
import { testTick } from './shared/haptics.js';
import { readClock, phaseOf, sceneStep, SESSION } from './shared/session.js';

initPage();

const TILES = [
  { id: 'bricks', label: 'BRICKS', active: true, href: 'games/bricks/' },
  { id: 'catch', label: 'CATCH', active: true, href: 'games/catch/' },
  { id: 'putt', label: 'PUTT', active: true, href: 'games/putt/' },
  { id: 'stack', label: 'STACK', active: true, href: 'games/stack/' },
];

// Tile height and gap, largest first; short screens take a smaller pair
// (U1: the smallest pair added so four tiles fit a logical height of 240).
const TILE_SIZES = [[22, 6], [20, 5], [18, 4], [16, 3], [15, 2]];
const SUN_CLEAR = SUN_RADIUS + 4; // tiles end this far above the horizon to keep the sun clear
const TOGGLE_H = 15;
const TOGGLE_W = 75;
// B4 contrast pass: every control and the wordmark carry a 1 px edge all round
// that stands off every scene colour; the active tiles take white lettering
// in a 1 px outline of the coral's edge; the SOON tile keeps a pale fill with an edge and
// label in the coral's edge colour; the tag and the toggle use the ink.
const SOON_FILL = mix(COLORS.skyBottom, COLORS.cloud, 0.45);
const SOON_INK = edge(COLORS.coral);
const TILE_INK = COLORS.cloud;
const SOON_SHADE = mix(SOON_FILL, COLORS.shadeTarget, 0.12);
const TAG_FILL = COLORS.card;
const TILE_EDGE = edge(COLORS.coral);

let pressed = null;
let haptics = hapticsOn();
let rects = {};
let resetTimer = 0;

// The hub never advances the clock; it shows the phase of the saved clock.
// After the reset gap that is sunset; a hub left open redraws at that moment.
function currentPhase() {
  const { clock } = readClock(Date.now());
  clearTimeout(resetTimer);
  if (clock.last !== null && clock.active > 0) {
    const wait = clock.last + SESSION.resetGapMin * 60 * 1000 - Date.now();
    resetTimer = setTimeout(() => screen.render(), Math.max(0, wait) + 50);
  }
  return phaseOf(clock.active);
}

function layout(s) {
  const { W, H, safe } = s;
  const side = Math.max(safe.left, safe.right);
  const mx = 8 + side;
  const horizon = H - SEA_HEIGHT;
  const r = {};
  r.wordmark = { x: mx, y: safe.top + 11, w: W - mx * 2, h: 30 }; // letters at y + 12, 28 tall, in a 1 px outline
  const tw = W - (mx + 8) * 2;
  // Tiles live in the lower half and never start above it. Prefer the
  // largest tiles that leave the sun clear; else the largest that leave at
  // least half the sun showing; else the smallest.
  const minTop = Math.max(Math.ceil(H / 2), r.wordmark.y + r.wordmark.h + 10);
  const stack = ([h, g]) => TILES.length * h + (TILES.length - 1) * g;
  let size = TILE_SIZES.find((sz) => minTop + stack(sz) <= horizon - SUN_CLEAR);
  let ty;
  if (size) {
    ty = horizon - SUN_CLEAR - stack(size);
  } else {
    size = TILE_SIZES.find((sz) => minTop + stack(sz) <= horizon - SUN_RADIUS / 2)
      || TILE_SIZES[TILE_SIZES.length - 1];
    ty = minTop;
  }
  const [th, gap] = size;
  TILES.forEach((t, i) => {
    r[t.id] = { x: mx + 8, y: ty + i * (th + gap), w: tw, h: th };
  });
  const toggleY = Math.min(horizon + 13, H - safe.bottom - 3 - TOGGLE_H);
  r.haptics = { x: Math.floor((W - TOGGLE_W) / 2), y: toggleY, w: TOGGLE_W, h: TOGGLE_H };
  return r;
}

// One box computation, used both to size the labels and to draw them.
const TILE_PAD = 6;
const TAG_W = measure('SOON', 1) + 6;
const TAG_H = 11;

function tileParts(t, r, y) {
  const right = r.x + r.w - TILE_PAD;
  const parts = {};
  let end;
  if (t.active) {
    parts.chevron = { x: right - 4, y: y + Math.floor((r.h - 7) / 2) };
    end = parts.chevron.x - 4;
  } else {
    parts.tag = { x: right - TAG_W + 2, y: y + Math.floor((r.h - TAG_H) / 2), w: TAG_W, h: TAG_H };
    end = parts.tag.x - 4;
  }
  parts.label = { x: r.x + TILE_PAD, y: y + 3, w: end - (r.x + TILE_PAD), h: r.h - 6 };
  return parts;
}

// The largest size at which every label fits its box (with room for the
// 1 px outline or the 1 px drop shade), so all tiles share one label size.
function labelSizeFor(tiles, rectsById) {
  let size = 16;
  for (const t of tiles) {
    const box = tileParts(t, rectsById[t.id], rectsById[t.id].y).label;
    // Active labels: a 1 px outline all round (2 px each way); SOON: the 1 px drop shade.
    size = t.active ? Math.min(size, fitSize(t.label, box.w - 2, box.h - 2, 16))
      : Math.min(size, fitSize(t.label, box.w, box.h - 1, 16));
  }
  return Math.max(1, size);
}

function drawTile(ctx, t, r, labelSize) {
  const y = r.y + (pressed === t.id ? 1 : 0);
  const active = t.active;
  pixelBody(ctx, r.x, y, r.w, r.h, active ? COLORS.coral : SOON_FILL, 2, active ? TILE_EDGE : SOON_INK);
  const parts = tileParts(t, r, y);
  if (parts.chevron) {
    // chevron: this one opens
    ctx.fillStyle = TILE_INK;
    const { x: cx, y: cy } = parts.chevron;
    [0, 1, 2, 3, 2, 1, 0].forEach((c, i) => ctx.fillRect(cx + c, cy + i, 2, 1));
  }
  if (parts.tag) {
    const g = parts.tag;
    pixelBody(ctx, g.x, g.y, g.w, g.h, TAG_FILL, 1);
    drawFitted(ctx, 'SOON', { x: g.x + 3, y: g.y + 2, w: g.w - 6, h: g.h - 3 }, COLORS.ink, { maxSize: 1 });
  }
  return drawFitted(ctx, t.label, parts.label, active ? TILE_INK : SOON_INK, {
    align: 'left',
    maxSize: labelSize,
    // B4 review: white in a 1 px outline of the coral's edge (6.13:1), as the
    // wordmark; the outline takes the place of the drop shade.
    shadow: active ? null : SOON_SHADE,
    outline: active ? TILE_EDGE : null,
  });
}

function drawToggle(ctx, r) {
  const down = pressed === 'haptics' ? 1 : 0;
  const y = r.y + down;
  // On: an ink body in a white rim; off: a white body in an ink rim. One of
  // the two stands off every sea colour at every scene step.
  const fill = haptics ? COLORS.ink : COLORS.cloud;
  pixelBody(ctx, r.x, y, r.w, r.h, fill, 2, haptics ? COLORS.cloud : COLORS.ink);
  const text = haptics ? 'HAPTICS ON' : 'HAPTICS OFF';
  const box = { x: r.x + 4, y: y + 3, w: r.w - 8, h: r.h - 5 };
  // one size for both states, fitted to the longer label
  const size = fitSize('HAPTICS OFF', box.w, box.h, 2);
  drawFitted(ctx, text, box, haptics ? COLORS.cloud : COLORS.ink, { maxSize: size });
}

function draw(ctx, s) {
  rects = layout(s);
  const firstTile = rects[TILES[0].id].y;
  const wordBottom = rects.wordmark.y + rects.wordmark.h;
  const open = firstTile - wordBottom;
  const phase = currentPhase();
  drawScene(ctx, s.W, s.H, {
    clouds: [
      [96, wordBottom + Math.round(open * 0.2)],
      [10, wordBottom + Math.round(open * 0.5)],
      [62, wordBottom + Math.round(open * 0.78)],
    ],
    phase,
    stars: [wordBottom + 2, firstTile - 3],
  });
  canvas.dataset.scene = String(sceneStep(phase));
  drawFitted(ctx, 'RLX', rects.wordmark, COLORS.coral, { maxSize: 6, outline: TILE_EDGE });

  const labelSize = labelSizeFor(TILES, rects);
  const drawn = {};
  for (const t of TILES) drawn[t.id] = drawTile(ctx, t, rects[t.id], labelSize);
  canvas.dataset.labels = JSON.stringify(drawn);
  drawToggle(ctx, rects.haptics);
  publishHits(canvas, s, { bricks: rects.bricks, catch: rects.catch, putt: rects.putt, stack: rects.stack, haptics: rects.haptics });
}

const canvas = document.getElementById('screen');
const screen = createScreen(canvas, draw);

function targetAt(e) {
  const p = screen.toLogical(e.clientX, e.clientY);
  if (hitTest(p, rects.haptics, 3)) return 'haptics';
  for (const t of TILES) if (t.active && hitTest(p, rects[t.id], 2)) return t.id;
  return null;
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  pressed = targetAt(e);
  if (pressed) screen.render();
});

canvas.addEventListener('pointerup', (e) => {
  e.preventDefault();
  const hit = targetAt(e);
  const was = pressed;
  pressed = null;
  if (hit && hit === was) {
    if (hit === 'haptics') {
      haptics = setHaptics(!haptics);
      if (haptics) testTick();
    } else {
      const t = TILES.find((x) => x.id === hit);
      if (t && t.active) {
        screen.render();
        openPage(t.href);
        return;
      }
    }
  }
  screen.render();
});

const release = () => { if (pressed) { pressed = null; screen.render(); } };
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('pointerleave', release);
addEventListener('pageshow', () => { pressed = null; haptics = hapticsOn(); screen.render(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) screen.render(); });
</script>
</body>
</html>
