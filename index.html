<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFF7EC">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>RLX</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="shared/theme.css">
</head>
<body>
<canvas class="screen" id="screen" role="img" aria-label="RLX: Bricks, Catch, Putt and Stack. The Android back gesture returns from a game."></canvas>
<script type="module">
import { COLORS, edge } from './shared/tokens.js';
import { drawFitted, fitSize } from './shared/font.js';
import {
  createScreen, drawScene, pixelBody, initPage, hitTest, publishHits, SEA_HEIGHT, SUN_RADIUS,
} from './shared/pixel.js';
import { sessionClock, phaseOf, sceneStep } from './shared/session.js';

initPage();

// The hub is the game tiles and nothing else (PLAN §2): one active tile per built game.
const TILES = [
  { id: 'bricks', label: 'BRICKS', href: 'games/bricks/' },
  { id: 'catch', label: 'CATCH', href: 'games/catch/' },
  { id: 'putt', label: 'PUTT', href: 'games/putt/' },
  { id: 'stack', label: 'STACK', href: 'games/stack/' },
];

// Tile height and gap, largest first; short screens take a smaller pair
// (U1: the smallest pair added so four tiles fit a logical height of 240).
const TILE_SIZES = [[22, 6], [20, 5], [18, 4], [16, 3], [15, 2]];
const SUN_CLEAR = SUN_RADIUS + 4; // tiles end this far above the horizon to keep the sun clear
// B4 contrast pass: every tile and the wordmark carry a 1 px edge all round
// that stands off every scene colour; the tiles take white lettering in a
// 1 px outline of the coral's edge.
const TILE_INK = COLORS.cloud;
const TILE_EDGE = edge(COLORS.coral);

const clock = sessionClock(); // the one session clock: the hub holds it, the games it opens share it
let pressed = null;
let rects = {};

function layout(s) {
  const { W, H, safe } = s;
  const side = Math.max(safe.left, safe.right);
  const mx = 8 + side;
  const horizon = H - SEA_HEIGHT;
  const r = {};
  r.wordmark = { x: mx, y: safe.top + 11, w: W - mx * 2, h: 30 }; // letters at y + 12, 28 tall, in a 1 px outline
  const tw = W - (mx + 8) * 2;
  // Tiles live in the lower half and never start above it. Prefer the
  // largest tiles that leave the sun clear; else the largest that leave at
  // least half the sun showing; else the smallest.
  const minTop = Math.max(Math.ceil(H / 2), r.wordmark.y + r.wordmark.h + 10);
  const stack = ([h, g]) => TILES.length * h + (TILES.length - 1) * g;
  let size = TILE_SIZES.find((sz) => minTop + stack(sz) <= horizon - SUN_CLEAR);
  let ty;
  if (size) {
    ty = horizon - SUN_CLEAR - stack(size);
  } else {
    size = TILE_SIZES.find((sz) => minTop + stack(sz) <= horizon - SUN_RADIUS / 2)
      || TILE_SIZES[TILE_SIZES.length - 1];
    ty = minTop;
  }
  const [th, gap] = size;
  TILES.forEach((t, i) => {
    r[t.id] = { x: mx + 8, y: ty + i * (th + gap), w: tw, h: th };
  });
  return r;
}

// One box computation, used both to size the labels and to draw them.
const TILE_PAD = 6;

function tileParts(r, y) {
  const right = r.x + r.w - TILE_PAD;
  const chevron = { x: right - 4, y: y + Math.floor((r.h - 7) / 2) };
  const end = chevron.x - 4;
  return { chevron, label: { x: r.x + TILE_PAD, y: y + 3, w: end - (r.x + TILE_PAD), h: r.h - 6 } };
}

// The largest size at which every label fits its box (with room for the
// 1 px outline all round), so all tiles share one label size.
function labelSizeFor(tiles, rectsById) {
  let size = 16;
  for (const t of tiles) {
    const box = tileParts(rectsById[t.id], rectsById[t.id].y).label;
    size = Math.min(size, fitSize(t.label, box.w - 2, box.h - 2, 16));
  }
  return Math.max(1, size);
}

function drawTile(ctx, t, r, labelSize) {
  const y = r.y + (pressed === t.id ? 1 : 0);
  pixelBody(ctx, r.x, y, r.w, r.h, COLORS.coral, 2, TILE_EDGE);
  const parts = tileParts(r, y);
  // chevron: this one opens
  ctx.fillStyle = TILE_INK;
  const { x: cx, y: cy } = parts.chevron;
  [0, 1, 2, 3, 2, 1, 0].forEach((c, i) => ctx.fillRect(cx + c, cy + i, 2, 1));
  // B4 review: white in a 1 px outline of the coral's edge (6.13:1), as the wordmark.
  return drawFitted(ctx, t.label, parts.label, TILE_INK, { align: 'left', maxSize: labelSize, outline: TILE_EDGE });
}

function draw(ctx, s) {
  rects = layout(s);
  const firstTile = rects[TILES[0].id].y;
  const wordBottom = rects.wordmark.y + rects.wordmark.h;
  const open = firstTile - wordBottom;
  // The hub never advances the clock; it shows the phase it stands at.
  const phase = phaseOf(clock.active);
  drawScene(ctx, s.W, s.H, {
    clouds: [
      [96, wordBottom + Math.round(open * 0.2)],
      [10, wordBottom + Math.round(open * 0.5)],
      [62, wordBottom + Math.round(open * 0.78)],
    ],
    phase,
    stars: [wordBottom + 2, firstTile - 3],
  });
  canvas.dataset.scene = String(sceneStep(phase));
  drawFitted(ctx, 'RLX', rects.wordmark, COLORS.coral, { maxSize: 6, outline: TILE_EDGE });

  const labelSize = labelSizeFor(TILES, rects);
  const drawn = {};
  for (const t of TILES) drawn[t.id] = drawTile(ctx, t, rects[t.id], labelSize);
  canvas.dataset.labels = JSON.stringify(drawn);
  const hitRects = {};
  for (const t of TILES) hitRects[t.id] = rects[t.id];
  publishHits(canvas, s, hitRects);
}

const canvas = document.getElementById('screen');
const screen = createScreen(canvas, draw);

/* ---------- opening a game: a fresh frame over the hub ---------- */

// The game is made on the tile's touch, so the tap that opens it also counts
// as the game page's own tap (Chrome lets a page vibrate only after one); it
// shows when the touch lifts on the tile, with a history entry, so the
// Android back gesture returns here. Going back removes the frame: the next
// opening is a fresh game. The page itself never leaves the hub, so the
// session clock lives on in memory across games.
let game = null; // { el, id, shown }

function prepare(t) {
  discard();
  const el = document.createElement('iframe');
  el.className = 'game';
  el.title = t.label;
  el.src = t.href;
  document.body.appendChild(el);
  game = { el, id: t.id, shown: false };
}

function show() {
  game.shown = true;
  game.el.classList.add('shown');
  document.body.dataset.game = game.id;
  history.pushState({ rlx: game.id }, '');
}

function discard() {
  if (!game) return;
  game.el.remove();
  game = null;
  delete document.body.dataset.game;
}

addEventListener('popstate', () => {
  if (game && game.shown) {
    discard();
    screen.render();
  }
});
// Reopened on a game's history entry (a reload): the hub shows, with no game.
// The entry is left behind with one back, so the first back gesture after a reload does not land on the hub again.
if (history.state && history.state.rlx) history.back();

function targetAt(e) {
  const p = screen.toLogical(e.clientX, e.clientY);
  for (const t of TILES) if (hitTest(p, rects[t.id], 2)) return t.id;
  return null;
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (game && game.shown) return;
  pressed = targetAt(e);
  if (pressed) {
    prepare(TILES.find((t) => t.id === pressed));
    screen.render();
  }
});

canvas.addEventListener('pointerup', (e) => {
  e.preventDefault();
  const hit = targetAt(e);
  const was = pressed;
  pressed = null;
  if (hit && hit === was && game && !game.shown) show();
  else if (game && !game.shown) discard();
  screen.render();
});

const release = () => {
  if (pressed) {
    pressed = null;
    if (game && !game.shown) discard();
    screen.render();
  }
};
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('pointerleave', release);
addEventListener('pageshow', () => { release(); screen.render(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) screen.render(); });
</script>
</body>
</html>
